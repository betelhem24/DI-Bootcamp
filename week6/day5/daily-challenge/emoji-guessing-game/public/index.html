<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 Emoji Guessing Game</title>
    <link rel="stylesheet" href="style.css">
    
    <!--
    EMOJI GUESSING GAME - FRONTEND INTERFACE
    
    This HTML file fulfills Requirement #4:
    "Using a form, present the player with the random emoji and multiple choice options"
    
    This file works with:
    - server.js (Express API backend)
    - script.js (handles form submission via Fetch API - Requirement #5)
    - style.css (styling)
    
    The form data is POSTed to the Express API using the Fetch API as required.
    -->
</head>
<body>
    <div class="container">
        <header>
            <h1>🎮 Emoji Guessing Game</h1>
            <p>Guess the name of the emoji!</p>
        </header>

        <!-- Player Name Section -->
        <!-- Requirement #9: Track player's total score (needs player identification) -->
        <div id="nameSection" class="section">
            <h2>Enter Your Name</h2>
            <input 
                type="text" 
                id="playerName" 
                placeholder="Your Name" 
                maxlength="20" 
                required
                aria-label="Player name input"
            >
            <button onclick="startGame()" class="btn btn-primary">Start Game</button>
        </div>

        <!-- Game Section -->
        <!-- Requirement #4: Present the player with emoji and multiple choice options -->
        <!-- Requirement #8: Continue presenting new emojis -->
        <div id="gameSection" class="section hidden">
            <!-- Score Board - Requirement #9: Keep track of player's total score -->
            <div class="score-board">
                <div class="score-item">
                    <span class="label">Player:</span>
                    <span id="displayName" class="value">-</span>
                </div>
                <div class="score-item">
                    <span class="label">Score:</span>
                    <span id="score" class="value">0</span>
                </div>
                <div class="score-item">
                    <span class="label">Round:</span>
                    <span id="round" class="value">0</span>
                </div>
            </div>

            <!-- Emoji Display - Requirement #4: Present the random emoji -->
            <div class="emoji-display">
                <div id="emojiContainer" class="emoji-large" aria-label="Emoji to guess">🎯</div>
            </div>

            <!-- Form for submitting guess -->
            <!-- Requirement #5: Allow player to submit guess using Fetch API (handled in script.js) -->
            <form id="guessForm" class="guess-form">
                <!-- Multiple choice options - Requirement #4 -->
                <div id="optionsContainer" class="options-container">
                    <!-- Options will be dynamically added by script.js from API response -->
                </div>
                
                <!-- Submit button - Requirement #5: Submit guess -->
                <button type="submit" class="btn btn-primary">Submit Guess</button>
            </form>

            <!-- Feedback display - Requirement #7: Provide feedback to the player -->
            <div id="feedback" class="feedback hidden" role="alert"></div>

            <!-- Game controls - Requirement #8: Continue presenting new emojis -->
            <div class="game-controls">
                <button onclick="nextQuestion()" class="btn btn-secondary">Next Question</button>
                <button onclick="endGame()" class="btn btn-danger">End Game</button>
            </div>
        </div>

        <!-- Leaderboard Section -->
        <!-- Requirement #10: Implement a leaderboard to show the top scores -->
        <div id="leaderboardSection" class="section hidden">
            <h2>🏆 Leaderboard</h2>
            <div id="leaderboardList" class="leaderboard-list">
                <p class="no-scores">No scores yet. Be the first to play!</p>
            </div>
            <button onclick="showNameSection()" class="btn btn-secondary">Play Again</button>
        </div>
    </div>

    <!-- 
    Load the JavaScript that handles:
    - Fetching emoji questions from the API (Requirement #3)
    - Submitting guesses via Fetch API POST (Requirement #5)
    - Displaying feedback (Requirement #7)
    - Updating score (Requirement #6, #9)
    - Managing leaderboard (Requirement #10)
    -->
    <script src="script.js"></script>
</body>
</html>
