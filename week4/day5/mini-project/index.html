<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Mini Project</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
    <h1>Star Wars Character Finder</h1>

    <!-- Placeholder for dynamic content -->
    <div id="character-info">
        <p class="loading">Click "Find Someone" to load a character</p>
    </div>

    <button id="get-character-btn">Find Someone</button>

    <!-- JAVASCRIPT IS INSIDE THIS FILE -->
    <script>
        // Get DOM elements
        const characterInfo = document.getElementById("character-info");
        const getCharacterBtn = document.getElementById("get-character-btn");

        // Cache homeworlds to avoid duplicate API calls
        const homeworldCache = {};

        // Fetch a random Star Wars character
        async function fetchCharacter(retries = 1) {
            characterInfo.innerHTML = `
                <p class="loading"><i class="fas fa-spinner fa-spin"></i> Loading...</p>
            `;

            const randomId = Math.floor(Math.random() * 83) + 1;

            try {
                const response = await fetch(`https://www.swapi.tech/api/people/${randomId}`);
                if (!response.ok) throw new Error("Character not found");

                const data = await response.json();
                const props = data.result.properties;

                const name = props.name || "Unknown";
                const height = props.height || "Unknown";
                const gender = props.gender || "Unknown";
                const birthYear = props.birth_year || "Unknown";
                const homeworldUrl = props.homeworld;

                let homeworldName = "Unknown";

                if (homeworldUrl) {
                    if (homeworldCache[homeworldUrl]) {
                        homeworldName = homeworldCache[homeworldUrl];
                    } else {
                        try {
                            const hwRes = await fetch(homeworldUrl);
                            const hwData = await hwRes.json();
                            homeworldName = hwData.result.properties.name;
                            homeworldCache[homeworldUrl] = homeworldName;
                        } catch {
                            homeworldName = "Unknown";
                        }
                    }
                }

                characterInfo.innerHTML = `
                    <h2>${name}</h2>
                    <p><strong>Height:</strong> ${height} cm</p>
                    <p><strong>Gender:</strong> ${gender}</p>
                    <p><strong>Birth Year:</strong> ${birthYear}</p>
                    <p><strong>Homeworld:</strong> ${homeworldName}</p>
                `;
            } catch (error) {
                if (retries > 0) {
                    return setTimeout(() => fetchCharacter(retries - 1), 500);
                }
                characterInfo.innerHTML = `
                    <p class="error"><i class="fas fa-triangle-exclamation"></i> Error loading character. Please try again.</p>
                `;
            }
        }

        // Button click event listener
        getCharacterBtn.addEventListener("click", () => fetchCharacter());
    </script>
</body>
</html>
