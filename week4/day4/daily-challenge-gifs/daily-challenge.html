<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random GIF Fetcher</title>
</head>
<body>
    <!-- Form for user input -->
    <form id="gifForm">
        <input type="text" id="gifInput" placeholder="Enter a category..." required>
        <button type="submit">Fetch GIF</button>
    </form>

    <!-- Button to delete all GIFs -->
    <button id="deleteAllBtn">DELETE ALL</button>

    <!-- Container to append GIFs -->
    <div id="gifContainer"></div>

    <!-- Link JS file -->
    <script src="script.js"></script>
</body>
</html>
