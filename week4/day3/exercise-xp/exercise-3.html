<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 3 : JSON Mario</title>
</head>
<body>
    <script>
        const marioGame = {
  detail : "An amazing game!",
  characters : {
      mario : {
        description:"Small and jumpy. Likes princesses.",
        height: 10,
        weight: 3,
        speed: 12,
      },
      bowser : {
        description: "Big and green, Hates princesses.",
        height: 16,
        weight: 6,
        speed: 4,
      },
      princessPeach : {
        description: "Beautiful princess.",
        height: 12,
        weight: 2,
        speed: 2,
      }
  },
}

// Convert JS object to JSON string
const marioJSON = JSON.stringify(marioGame);

// Pretty print JSON
const marioJSONPretty = JSON.stringify(marioGame, null, 2);

// Log to console so we can see it
console.log("JSON string:", marioJSON);
console.log("Pretty JSON string:", marioJSONPretty);
    </script>
</body>
</html>
