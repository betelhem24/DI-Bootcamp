<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List without Browser History</title>
    <link rel="stylesheet" href="daily-challenge-todo-list.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="todo-container">
        <h2>Todo List</h2>
        <form id="todoForm" autocomplete="off">
            <!-- Trick browser not to store history: use a unique autocomplete value -->
            <input list="historyList" type="text" id="taskInput" name="new-task" placeholder="Add your task" autocomplete="new-password">
            <datalist id="historyList"></datalist>
            <button type="submit">Add</button>
        </form>
        <div class="listTasks"></div>
        <!-- Hidden clear history button for session autocomplete -->
        <button id="clearHistory" style="display:none;">Clear History</button>
    </div>

    <script src="daily-challenge-todo-list.js"></script>
</body>
</html>
