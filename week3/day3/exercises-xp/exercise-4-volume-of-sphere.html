<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 4 - Volume of a Sphere</title>
    <style>  
        body {
            padding-top: 30px;
        } 
        label, input {
            display: block;
            margin-bottom: 10px;
        }  
    </style> 
</head>
<body> 
    <h1>Exercise 4 – Volume of a Sphere</h1>
    <p>Input radius value and get the volume of a sphere.</p> 
    <form id="MyForm"> 
        <label for="radius">Radius</label>
        <input type="text" name="radius" id="radius" required> 
        <label for="volume">Volume</label>
        <input type="text" name="volume" id="volume" readonly> 
        <input type="submit" value="Calculate" id="submit">    
    </form> 

    <script src="exercise-4-volume-of-a-sphere.js"></script>
</body> 
</html>
