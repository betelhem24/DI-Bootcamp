<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input.error {
            border-color: #dc3545;
        }

        .error-message {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name">First Name *</label>
                <input type="text" id="name" name="name" required minlength="2">
                <span class="error-message" id="nameError">First name is required</span>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" required minlength="2">
                <span class="error-message" id="lastNameError">Last name is required</span>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
                <span class="error-message" id="emailError">Valid email is required</span>
            </div>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required minlength="3">
                <span class="error-message" id="usernameError">Username must be at least 3 characters</span>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required minlength="6">
                <span class="error-message" id="passwordError">Password must be at least 6 characters</span>
            </div>

            <button type="submit" id="submitBtn" disabled>Register</button>
        </form>

        <div id="message" class="message"></div>

        <div class="login-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        const fields = {
            name: document.getElementById('name'),
            lastName: document.getElementById('lastName'),
            email: document.getElementById('email'),
            username: document.getElementById('username'),
            password: document.getElementById('password')
        };

        // Validation functions
        function validateField(field) {
            const value = field.value.trim();
            let isValid = true;
            let errorMsg = '';

            switch(field.id) {
                case 'name':
                case 'lastName':
                    isValid = value.length >= 2;
                    errorMsg = `${field.id === 'name' ? 'First' : 'Last'} name is required`;
                    break;
                case 'email':
                    isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
                    errorMsg = 'Valid email is required';
                    break;
                case 'username':
                    isValid = value.length >= 3;
                    errorMsg = 'Username must be at least 3 characters';
                    break;
                case 'password':
                    isValid = value.length >= 6;
                    errorMsg = 'Password must be at least 6 characters';
                    break;
            }

            const errorElement = document.getElementById(`${field.id}Error`);
            if (!isValid && value.length > 0) {
                field.classList.add('error');
                errorElement.textContent = errorMsg;
                errorElement.style.display = 'block';
            } else {
                field.classList.remove('error');
                errorElement.style.display = 'none';
            }

            return isValid && value.length > 0;
        }

        // Validate entire form
        function validateForm() {
            let isValid = true;
            
            for (let key in fields) {
                if (!validateField(fields[key])) {
                    isValid = false;
                }
            }

            submitBtn.disabled = !isValid;
            return isValid;
        }

        // Add event listeners to all fields
        for (let key in fields) {
            fields[key].addEventListener('input', validateForm);
            fields[key].addEventListener('blur', function() {
                validateField(this);
            });
        }

        // Handle form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            const formData = {
                name: fields.name.value.trim(),
                lastName: fields.lastName.value.trim(),
                email: fields.email.value.trim(),
                username: fields.username.value.trim(),
                password: fields.password.value
            };

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Registering...';
                messageDiv.style.display = 'none';

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    // Success
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    form.reset();
                    
                    // Redirect to login after 2 seconds
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    // Error
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Register';
                }

            } catch (error) {
                console.error('Registration error:', error);
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });

        // Initial validation
        validateForm();
    </script>
</body>
</html>
