<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input.invalid {
            border-color: #dc3545;
        }

        .error-text {
            color: #dc3545;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s;
            margin-top: 10px;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 5px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Create Account</h1>
        <form id="registerForm" novalidate>
            <div class="form-group">
                <label for="name">First Name *</label>
                <input type="text" id="name" name="name" required>
                <div class="error-text" id="nameError">First name is required</div>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" required>
                <div class="error-text" id="lastNameError">Last name is required</div>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required>
                <div class="error-text" id="emailError">Valid email is required</div>
            </div>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" required>
                <div class="error-text" id="usernameError">Username must be at least 3 characters</div>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" required>
                <div class="error-text" id="passwordError">Password must be at least 6 characters</div>
            </div>

            <button type="submit" id="submitBtn" disabled>Register</button>
        </form>

        <div id="message" class="message"></div>

        <div class="login-link">
            Already have an account? <a href="/login">Login here</a>
        </div>
    </div>

    <script>
        // Get form elements
        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const messageDiv = document.getElementById('message');
        
        const nameInput = document.getElementById('name');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');

        // Validation function for each field
        function validateField(input) {
            const value = input.value.trim();
            let isValid = false;
            let errorMsg = '';

            switch(input.id) {
                case 'name':
                case 'lastName':
                    isValid = value.length > 0;
                    errorMsg = `${input.id === 'name' ? 'First' : 'Last'} name is required`;
                    break;
                case 'email':
                    isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
                    errorMsg = 'Valid email is required';
                    break;
                case 'username':
                    isValid = value.length >= 3;
                    errorMsg = 'Username must be at least 3 characters';
                    break;
                case 'password':
                    isValid = input.value.length >= 6;
                    errorMsg = 'Password must be at least 6 characters';
                    break;
            }

            const errorElement = document.getElementById(`${input.id}Error`);
            
            if (!isValid && value.length > 0) {
                input.classList.add('invalid');
                errorElement.textContent = errorMsg;
                errorElement.style.display = 'block';
            } else {
                input.classList.remove('invalid');
                errorElement.style.display = 'none';
            }

            return isValid && value.length > 0;
        }

        // Check if all fields are valid
        function checkFormValidity() {
            const isNameValid = nameInput.value.trim().length > 0;
            const isLastNameValid = lastNameInput.value.trim().length > 0;
            const isEmailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value.trim());
            const isUsernameValid = usernameInput.value.trim().length >= 3;
            const isPasswordValid = passwordInput.value.length >= 6;

            const allValid = isNameValid && isLastNameValid && isEmailValid && isUsernameValid && isPasswordValid;
            
            submitBtn.disabled = !allValid;
            
            return allValid;
        }

        // Add input event listeners to all fields
        [nameInput, lastNameInput, emailInput, usernameInput, passwordInput].forEach(input => {
            input.addEventListener('input', checkFormValidity);
            input.addEventListener('blur', function() {
                validateField(this);
            });
        });

        // Form submission
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!checkFormValidity()) {
                return;
            }

            const formData = {
                name: nameInput.value.trim(),
                lastName: lastNameInput.value.trim(),
                email: emailInput.value.trim(),
                username: usernameInput.value.trim(),
                password: passwordInput.value
            };

            try {
                submitBtn.disabled = true;
                submitBtn.textContent = 'Registering...';
                messageDiv.style.display = 'none';

                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    form.reset();
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    messageDiv.textContent = data.message;
                    messageDiv.className = 'message error';
                    messageDiv.style.display = 'block';
                }

            } catch (error) {
                console.error('Registration error:', error);
                messageDiv.textContent = 'An error occurred. Please try again.';
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
            } finally {
                submitBtn.textContent = 'Register';
                checkFormValidity();
            }
        });

        // Initial check
        checkFormValidity();
    </script>
</body>
</html>
